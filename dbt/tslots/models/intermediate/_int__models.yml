version: 2

models:
  - name: int_operations_with_balance__agent_slot_item
    description: >
      Операции с денормализованными атрибутами, нарастающими балансами и диагностикой ячеек.
      Зерно: одна строка на операцию (agent × slot × item).
      INNER JOIN на int_prep__items_united_enriched отфильтровывает услуги, наборы и прочие сущности без товарной карточки.
      store_name берётся из документа (по store_id) — работает корректно когда ячейка не указана.
      open/close_slot_balance  — нарастающий остаток в ячейке (PARTITION BY agent, item, slot); операции без slot_id = 0.
      open/close_total_balance — нарастающий остаток по товару у агента по всем ячейкам (PARTITION BY agent, item; move не учитывается).
      slot_errors — диагностика аномалий: отрицательный остаток, несколько товаров в ячейке, расхождение с expected_bin_qty.
    columns:
      - name: item_id
        description: "UUID позиции"
      - name: slot_id
        description: "UUID ячейки; 'off_slot' если ячейка не указана в документе"
      - name: store_id
        description: "UUID склада (из документа)"
      - name: agent_id
        description: "UUID контрагента"
      - name: depositor_id
        description: "UUID поклажедателя"
      - name: expected_bin_qty
        description: "Ожидаемое кол-во товара в ячейке"
      - name: store_name
        description: "Название склада (из документа, не из ячейки)"
      - name: zone_name
        description: "Название зоны"
      - name: doc_type
        description: "Тип документа (demand, supply, loss, enter, move)"
      - name: doc_name
        description: "Номер документа"
      - name: moment
        description: "Дата и время операции"
        tests: [not_null]
      - name: moment_day
        description: "Дата операции (moment::date)"
      - name: op_type
        description: "Направление движения: in или out"
      - name: slot_name
        description: "Название ячейки"
      - name: quantity
        description: "Количество по операции (отрицательное для расхода)"
      - name: real_in
        description: "Приход по реальным операциям (supply, enter): quantity если doc_type != move и quantity > 0, иначе 0"
      - name: real_out
        description: "Расход по реальным операциям (demand, loss): quantity если doc_type != move и quantity < 0, иначе 0"
      - name: move_in
        description: "Приход от перемещений: quantity если doc_type = move и quantity > 0, иначе 0"
      - name: move_out
        description: "Расход от перемещений: quantity если doc_type = move и quantity < 0, иначе 0"
      - name: open_slot_balance
        description: "Остаток в ячейке до операции (PARTITION BY agent, item, slot)"
      - name: close_slot_balance
        description: "Остаток в ячейке после операции"
      - name: open_total_balance
        description: "Остаток товара у агента по всем ячейкам до операции (move не учитывается)"
      - name: close_total_balance
        description: "Остаток товара у агента по всем ячейкам после операции"
      - name: items_in_slot
        description: "Кол-во операций по данному товару в ячейке за день (PARTITION BY item_id, moment_day, slot_id)"
      - name: slot_errors
        description: "Диагностика: ERROR slot overdraft / WARNING slot has > 1 items / WARNING unexpected slot balance / NULL"
      - name: uom
        description: "Единица измерения"
      - name: item_name
        description: "Полное название позиции"
      - name: product
        description: "Название родительского товара"
      - name: lot
        description: "Партия"
      - name: mfg_date
        description: "Дата выработки"
      - name: article
        description: "Артикул"
      - name: weight
        description: "Вес"
      - name: volume
        description: "Объём"
      - name: agent_name
        description: "Название контрагента"
      - name: agent_inn
        description: "ИНН контрагента"
      - name: depositor_name
        description: "Название поклажедателя"
      - name: depositor_inn
        description: "ИНН поклажедателя"

  - name: int_balance__agent_slot_item_daily_spine
    description: >
      Ежедневная сетка занятых ячеек с нарастающими балансами и флагом занятости.
      Зерно: агент × склад × слот × товар × день (непрерывный ряд дат от первой операции до CURRENT_DATE).
      store_id включён в зерно и store_name берётся из документа — гарантирует корректный склад
      даже когда операция содержит склад без ячейки.
      Строки с is_used = 0 (пустые ячейки без оборота) исключены из финального SELECT.
      is_used = 1: товар присутствует (close > 0) либо полный оборот за день без остатка.
      is_used = 2: ошибка данных — отрицательный остаток.
      Обогащение атрибутами (агент, ячейка, товар) выполняется последним — только на отфильтрованных строках.
    columns:
      - name: agent_id
        description: "UUID агента"
      - name: slot_id
        description: "UUID ячейки"
      - name: item_id
        description: "UUID товара/варианта"
        tests: [not_null]
      - name: depositor_id
        description: "UUID поклажедателя"
      - name: moment_day
        description: "Дата"
        tests: [not_null]
      - name: agent_inn
        description: "ИНН агента"
      - name: agent_name
        description: "Название агента"
      - name: store_name
        description: "Название склада"
      - name: zone_name
        description: "Название зоны"
      - name: slot_name
        description: "Название ячейки"
      - name: item_name
        description: "Полное название товара/варианта"
      - name: depositor_inn
        description: "ИНН поклажедателя"
      - name: depositor_name
        description: "Название поклажедателя"
      - name: article
        description: "Артикул товара"
      - name: product
        description: "Название родительского товара"
      - name: lot
        description: "Партия"
      - name: mfg_date
        description: "Дата выработки"
      - name: open_slot_balance
        description: "Остаток в ячейке на начало дня (PARTITION BY slot, agent, item)"
        tests: [not_null]
      - name: quantity
        description: "Нетто изменение остатка за день (все операции)"
        tests: [not_null]
      - name: close_slot_balance
        description: "Остаток в ячейке на конец дня"
        tests: [not_null]
      - name: open_total_balance
        description: "Остаток товара у агента по всем ячейкам на начало дня (PARTITION BY agent, item; move не учитывается)"
        tests: [not_null]
      - name: close_total_balance
        description: "Остаток товара у агента по всем ячейкам на конец дня"
        tests: [not_null]
      - name: real_in
        description: "Приход по реальным операциям (supply, enter) за день"
      - name: move_in
        description: "Приход от перемещений за день"
      - name: real_out
        description: "Расход по реальным операциям (demand, loss) за день — отрицательное число"
      - name: move_out
        description: "Расход от перемещений за день — отрицательное число"

  - name: int_balance__slot_item_daily_spine
    description: >
      Ежедневная сетка остатков товаров в ячейках без разбивки по агентам.
      Зерно: слот × товар × день (непрерывный ряд дат).
      Roll-up поверх int_balance__agent_slot_item_daily_spine: суммирует движения по всем агентам,
      пересчитывает балансы на новом зерне.
      open/close_total_balance — остаток товара по всем ячейкам (PARTITION BY item_id; агент не учитывается).
      Атрибуты агента и поклажедателя не включены.
    columns:
      - name: slot_id
        description: "UUID ячейки"
      - name: item_id
        description: "UUID товара/варианта"
        tests: [not_null]
      - name: moment_day
        description: "Дата"
        tests: [not_null]
      - name: store_name
        description: "Название склада"
      - name: zone_name
        description: "Название зоны"
      - name: slot_name
        description: "Название ячейки"
      - name: item_name
        description: "Полное название товара/варианта"
      - name: open_slot_balance
        description: "Остаток в ячейке на начало дня (по всем агентам)"
      - name: quantity
        description: "Нетто изменение остатка за день (все агенты)"
      - name: close_slot_balance
        description: "Остаток в ячейке на конец дня (по всем агентам)"
      - name: open_total_balance
        description: "Остаток товара по всем ячейкам на начало дня"
      - name: close_total_balance
        description: "Остаток товара по всем ячейкам на конец дня"
      - name: real_in
        description: "Приход по реальным операциям за день (все агенты)"
      - name: move_in
        description: "Приход от перемещений за день (все агенты)"
      - name: real_out
        description: "Расход по реальным операциям за день — отрицательное число"
      - name: move_out
        description: "Расход от перемещений за день — отрицательное число"
