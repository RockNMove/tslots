version: 2

models:
  - name: int_operations_united
    description: >
      Единая таблица позиций по всем типам операционных документов.
      Объединяет 5 staging-таблиц: demand, supply, loss, enter, move.
      Содержит store_id документа — используется в int_operations_extended для получения названия склада.
      Используется как основа для int_operations_extended и int_used_slots_gridded.
    columns:
      - name: doc_id
        description: "UUID документа"
        tests: [not_null]
      - name: moment
        description: "Дата и время документа"
        tests: [not_null]
      - name: number
        description: "Номер документа"
      - name: agent_id
        description: "UUID контрагента (NULL для move, loss, enter)"
      - name: store_id
        description: "UUID склада документа"
      - name: item_id
        description: "UUID позиции (variant_id или product_id)"
        tests: [not_null]
      - name: quantity
        description: "Количество (отрицательное для расхода)"
        tests: [not_null]
      - name: slot_id
        description: "UUID ячейки хранения"
      - name: updated
        description: "Время последнего изменения документа"
        tests: [not_null]
      - name: doc_type
        description: "Тип документа: demand, supply, loss, enter, move"
        tests:
          - accepted_values:
              arguments:
                values: ['demand', 'supply', 'loss', 'enter', 'move']
      - name: op_type
        description: "Направление: in (приход) или out (расход)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['in', 'out']

  - name: int_items_united
    description: >
      Единый справочник позиций (товаров и вариантов).
      В МойСклад операции могут ссылаться как на product, так и на variant —
      эта модель объединяет оба типа под общим item_id с денормализованными атрибутами.
    columns:
      - name: item_id
        description: "UUID позиции — variant_id для вариантов, product_id для товаров без вариантов"
        tests: [not_null]
      - name: name
        description: "Полное название: для варианта — 'товар (партия, дата)', для товара — просто название"
        tests: [not_null]
      - name: updated
        tests: [not_null]
      - name: product
        description: "Название родительского товара (NULL для строк-товаров без вариантов)"
      - name: lot
        description: "Партия — характеристика варианта (NULL для товаров без вариантов)"
      - name: mfg_date
        description: "Дата выработки — характеристика варианта (NULL для товаров без вариантов)"
      - name: barcodes
        description: "Штрихкоды в формате JSONB (NULL для товаров без вариантов)"
      - name: article
        description: "Артикул товара"
      - name: weight
        description: "Вес товара"
      - name: volume
        description: "Объём товара"
      - name: uom
        description: "Название единицы измерения"
        tests: [not_null]
      - name: depositor
        description: "Название поклажедателя (из атрибута товара)"

  - name: int_slots_extended
    description: >
      Справочник ячеек с денормализованными названиями склада и зоны.
      Используется в витринах и Grafana вместо JOIN-ов к stg_slots + stg_zones + stg_stores.
    columns:
      - name: slot_id
        description: "UUID ячейки"
        tests: [unique, not_null]
      - name: store_name
        description: "Название склада"
      - name: zone_name
        description: "Название зоны (NULL если ячейка без зоны)"
      - name: name
        description: "Название ячейки"
        tests: [not_null]
      - name: updated
        description: "Время последнего обновления ячейки"

  - name: int_operations_extended
    description: >
      Операции с денормализованными атрибутами позиций, ячеек и контрагентов.
      store_name берётся напрямую из документа (JOIN со stg_moy_sklad__stores по store_id),
      а не через ячейку — корректно работает когда ячейка не указана.
      Готовая таблица фактов для построения витрин и Grafana без дополнительных JOIN-ов.
    columns:
      - name: moment
        description: "Дата и время операции"
        tests: [not_null]
      - name: item_id
        description: "UUID позиции"
      - name: slot_id
        description: "UUID ячейки"
      - name: store_name
        description: "Название склада"
      - name: zone_name
        description: "Название зоны"
      - name: doc_type
        description: "Тип документа (demand, supply, loss, enter, move)"
      - name: doc_name
        description: "Номер документа"
      - name: op_type
        description: "Направление движения: in или out"
      - name: slot_name
        description: "Название ячейки"
      - name: quantity
        description: "Количество (отрицательное для расхода)"
      - name: uom
        description: "Единица измерения"
      - name: item_name
        description: "Полное название позиции"
      - name: product
        description: "Название родительского товара"
      - name: lot
        description: "Партия"
      - name: mfg_date
        description: "Дата выработки"
      - name: article
        description: "Артикул"
      - name: weight
        description: "Вес"
      - name: volume
        description: "Объём"
      - name: barcodes
        description: "Штрихкоды"
      - name: client_name
        description: "Название контрагента"
      - name: client_inn
        description: "ИНН контрагента"
      - name: depositor
        description: "Название поклажедателя"

  - name: int_used_slots_gridded
    description: >
      Ежедневная ведомость остатков по ячейкам хранения.
      Строится на сетке (date × slot) с нарастающим итогом через оконную функцию.
      Каждая строка — один слот на один день.
    columns:
      - name: moment_day
        description: "Дата"
        tests: [not_null]
      - name: slot_name
        description: "Название ячейки хранения"
      - name: open_balance
        description: "Остаток на начало дня (нарастающий итог до текущего дня)"
        tests: [not_null]
      - name: daily_change
        description: "Изменение остатка за день (сумма всех операций по ячейке)"
        tests: [not_null]
      - name: is_used
        description: "1 — ячейка занята, 0 — пустая, NULL — ошибка данных (отрицательный остаток)"
