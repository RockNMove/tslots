version: 2

models:
  - name: stg_agents
    description: "Контрагенты (поклажедатели и прочие агенты) из МойСклад"
    columns:
      - name: agent_id
        description: "UUID контрагента"
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: inn
      - name: updated

  - name: stg_products
    description: "Номенклатура (товары) из МойСклад"
    columns:
      - name: product_id
        description: "UUID товара"
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: article
      - name: weight
      - name: volume
      - name: uom_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_uoms')
                field: uom_id
      - name: depositor_id
        description: "UUID поклажедателя — атрибут 'Поклажедатель' из МойСклад"
        tests:
          - relationships:
              arguments:
                to: ref('stg_agents')
                field: agent_id
      - name: updated

  - name: stg_variants
    description: "Варианты товаров с характеристиками (партия, дата выработки)"
    columns:
      - name: variant_id
        description: "UUID варианта"
        tests: [unique, not_null]
      - name: product_id
        description: "UUID родительского товара"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: lot
        description: "Партия — характеристика варианта"
      - name: mfg_date
        description: "Дата выработки — характеристика варианта"
      - name: barcodes
      - name: updated

  - name: stg_uoms
    description: "Единицы измерения из МойСклад"
    columns:
      - name: uom_id
        description: "UUID единицы измерения"
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: updated

  - name: stg_stores
    description: "Склады верхнего уровня из МойСклад"
    columns:
      - name: store_id
        description: "UUID склада"
        tests: [unique, not_null]
      - name: name
        tests: [not_null]
      - name: updated

  - name: stg_zones
    description: "Зоны хранения внутри склада"
    columns:
      - name: zone_id
        description: "UUID зоны"
        tests: [unique, not_null]
      - name: store_id
        description: "UUID родительского склада"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: name
        tests: [not_null]
      - name: updated

  - name: stg_slots
    description: "Ячейки хранения — минимальная адресная единица склада"
    columns:
      - name: slot_id
        description: "UUID ячейки"
        tests: [unique, not_null]
      - name: store_id
        description: "UUID склада-родителя"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_stores')
                field: store_id
      - name: zone_id
        description: "UUID зоны (опционально)"
      - name: name
        tests: [not_null]
      - name: updated

  - name: stg_operations
    description: "Все операционные документы в единой таблице позиций (demand, supply, loss, enter, move)"
    columns:
      - name: doc_id
        description: "UUID документа"
        tests: [not_null]
      - name: moment
      - name: number
      - name: agent_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_agents')
                field: agent_id
      - name: doc_type
        description: "Тип документа"
        tests:
          - accepted_values:
              arguments:
                values: ['demand', 'supply', 'loss', 'enter', 'move']
      - name: op_type
        description: "Направление движения товара: in (приход) или out (расход)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['in', 'out']
      - name: item_id
      - name: quantity
        tests: [not_null]
      - name: slot_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_slots')
                field: slot_id
      - name: updated
